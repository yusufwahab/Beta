name: Beta checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: beta_test
          POSTGRES_DB: beta_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      BETA_TEST_DATABASE_URL: postgres://postgres:beta_test@localhost:5432/beta_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Real HTTP and PostgreSQL workflows (Auth and ASR fixtures)
        run: node --test server/dist/http.integration.test.js
        env:
          BETA_HTTP_TEST_DATABASE_URL: postgres://postgres:beta_test@localhost:5432/beta_test
      - name: Validation evidence security and persistence (local fixtures only)
        run: node --test server/dist/validation.integration.test.js
        env:
          BETA_VALIDATION_TEST_DATABASE_URL: postgres://postgres:beta_test@localhost:5432/beta_test
      - name: Create isolated migration-test database
        run: PGPASSWORD=beta_test psql -h localhost -U postgres -d postgres -c 'create database beta_migration_test'
      - name: Migration startup and rollback checks
        run: node --test server/dist/migrate.integration.test.js
        env:
          BETA_MIGRATION_TEST_DATABASE_URL: postgres://postgres:beta_test@localhost:5432/beta_migration_test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
